<!DOCTYPE html><html lang="zh-TW"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="3D木偶" />
  <link rel="manifest" href="./manifest.json" />

  <title>3D 人偶觸控調整</title>
  <style>
    * {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: #181818;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #hud {
      position: absolute;
      top: env(safe-area-inset-top, 16px);
      left: 16px;
      background: rgba(25, 25, 25, 0.92);
      color: #fff;
      padding: 14px;
      border-radius: 12px;
      font-size: 13px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.5);
      border: 1px solid #3a3a3a;
      z-index: 10;
      line-height: 1.5;
      max-width: 290px;
    }
    .badge {
      color: #00ffcc;
      font-weight: bold;
    }
    .mode-group {
      display: flex;
      gap: 6px;
      margin-top: 10px;
    }
    .mode-btn {
      flex: 1;
      padding: 8px 4px;
      background: #333;
      color: #bbb;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
      font-weight: bold;
    }
    .mode-btn.active {
      background: #00d4aa;
      color: #181818;
      border-color: #00d4aa;
    }
    .action-btn {
      margin-top: 8px;
      width: 100%;
      padding: 7px;
      background: #444;
      color: #fff;
      border: 1px solid #666;
      border-radius: 6px;
      cursor: pointer;
      font-size: 12px;
    }
    .action-btn:active {
      background: #666;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script></head><body>
  <div id="hud">
    <div><strong>📱 iPad 觸控木偶人</strong></div>
    <div style="margin-top: 4px;">目前選中：<span id="currentPart" class="badge">無</span></div>
    
    <!-- 模式切換按鈕區 -->
    <div class="mode-group">
      <button id="modeBone" class="mode-btn active">🦴 調整關節</button>
      <button id="modeRotateView" class="mode-btn">🔄 旋轉視角</button>
      <button id="modePanView" class="mode-btn">✋ 平移視角</button>
    </div>

    <div id="gestureHint" style="color: #aaa; font-size: 11px; margin-top: 8px;">
      👉 <strong>單指</strong>：拖動關節<br>
      ✌️ <strong>雙指</strong>：旋轉/縮放 | 🖐️ <strong>三指</strong>：平移視角
    </div>

    <button id="resetPoseBtn" class="action-btn">重置站姿</button>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. 初始化場景
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181818);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 3.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.GridHelper(10, 20, 0x444444, 0x282828));
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(3, 8, 4);
    scene.add(dirLight);

    // 2. 控制器配置
    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.target.set(0, 1.0, 0);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.05;
    orbit.enablePan = true; // 開啟平移功能

    // 預設手勢配置（保留三指平移支援）
    function applyOrbitMode(mode) {
      if (mode === 'bone') {
        orbit.touches = {
          ONE: null, // 單指留給關節拖動
          TWO: THREE.TOUCH.DOLLY_ROTATE, // 雙指旋轉/縮放
        };
      } else if (mode === 'rotate') {
        orbit.touches = {
          ONE: THREE.TOUCH.ROTATE, // 單指直接轉動視角
          TWO: THREE.TOUCH.DOLLY_PAN
        };
      } else if (mode === 'pan') {
        orbit.touches = {
          ONE: THREE.TOUCH.PAN, // 單指直接平移視角
          TWO: THREE.TOUCH.DOLLY_ROTATE
        };
      }
      orbit.update();
    }
    applyOrbitMode('bone');

    const transform = new TransformControls(camera, renderer.domElement);
    transform.setMode('rotate');
    transform.size = 0.75;
    scene.add(transform);

    transform.addEventListener('dragging-changed', (e) => {
      orbit.enabled = !e.value;
    });

    // 3. 模式狀態管理
    let currentMode = 'bone'; // 'bone' | 'rotate' | 'pan'
    const btnBone = document.getElementById('modeBone');
    const btnRotate = document.getElementById('modeRotateView');
    const btnPan = document.getElementById('modePanView');
    const hintEl = document.getElementById('gestureHint');

    function switchMode(newMode) {
      currentMode = newMode;
      btnBone.classList.toggle('active', newMode === 'bone');
      btnRotate.classList.toggle('active', newMode === 'rotate');
      btnPan.classList.toggle('active', newMode === 'pan');

      applyOrbitMode(newMode);

      if (newMode === 'bone') {
        hintEl.innerHTML = '👉 <strong>單指</strong>：拖動關節<br>✌️ <strong>雙指</strong>：旋轉/縮放 | 🖐️ <strong>三指</strong>：平移視角';
      } else if (newMode === 'rotate') {
        hintEl.innerHTML = '👉 <strong>單指</strong>：旋轉視角<br>✌️ <strong>雙指</strong>：縮放視角';
        selectBone(null); // 離開關節模式時取消選取
      } else if (newMode === 'pan') {
        hintEl.innerHTML = '👉 <strong>單指</strong>：平移視角 (移動畫面)<br>✌️ <strong>雙指</strong>：旋轉/縮放';
        selectBone(null);
      }
    }

    btnBone.addEventListener('click', () => switchMode('bone'));
    btnRotate.addEventListener('click', () => switchMode('rotate'));
    btnPan.addEventListener('click', () => switchMode('pan'));

    // 4. 中文名稱對照表
    function toChineseName(name) {
      const n = name.toLowerCase();
      if (n.includes('head')) return '頭部';
      if (n.includes('neck')) return '頸部';
      if (n.includes('spine2') || n.includes('chest')) return '胸部 / 上身';
      if (n.includes('spine1')) return '腹部';
      if (n.includes('spine')) return '腰部 / 脊椎';
      if (n.includes('hips') || n.includes('pelvis')) return '骨盆';

      const isLeft = n.includes('left') || n.endsWith('_l') || n.includes('.l');
      const isRight = n.includes('right') || n.endsWith('_r') || n.includes('.r');
      const prefix = isLeft ? '左' : isRight ? '右' : '';

      if (n.includes('shoulder')) return prefix + '肩膀';
      if (n.includes('forearm') || n.includes('elbow')) return prefix + '手肘（前臂）';
      if (n.includes('arm')) return prefix + '手臂（上臂）';
      if (n.includes('hand') || n.includes('wrist')) return prefix + '手掌';
      if (n.includes('upleg') || n.includes('thigh')) return prefix + '大腿';
      if (n.includes('leg') || n.includes('knee') || n.includes('calf')) return prefix + '膝蓋（小腿）';
      if (n.includes('foot') || n.includes('ankle') || n.includes('toe')) return prefix + '腳掌';

      return name;
    }

    // 5. 模型載入與關節判定球
    const loader = new GLTFLoader();
    const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

    const pickableJoints = [];
    const defaultRotations = new Map();
    let loadedModel = null;
    let selectedBone = null;
    const currentPartEl = document.getElementById('currentPart');

    loader.load(MODEL_URL, (gltf) => {
      loadedModel = gltf.scene;
      scene.add(loadedModel);

      const sphereGeo = new THREE.SphereGeometry(0.07, 12, 12);

      loadedModel.traverse((child) => {
        if (child.isBone) {
          defaultRotations.set(child, child.rotation.clone());

          const chName = toChineseName(child.name);
          const isFinger = /thumb|index|middle|ring|pinky/i.test(child.name);

          if (!isFinger && chName !== child.name) {
            const jointMesh = new THREE.Mesh(
              sphereGeo,
              new THREE.MeshBasicMaterial({
                color: 0x00d4aa,
                transparent: true,
                opacity: 0.45,
                depthTest: false
              })
            );
            jointMesh.userData = {
              bone: child,
              chineseName: chName
            };
            child.add(jointMesh);
            pickableJoints.push(jointMesh);
          }
        }
      });
    });

    function selectBone(bone, name) {
      selectedBone = bone;
      if (bone) {
        transform.attach(bone);
        currentPartEl.textContent = name || toChineseName(bone.name);
      } else {
        transform.detach();
        currentPartEl.textContent = '無';
      }
    }

    // 6. 觸控拖曳邏輯
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDraggingBone = false;
    let lastX = 0;
    let lastY = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#hud')) return;
      if (transform.dragging) return;

      // 若非關節模式，直接交由 OrbitControls 處理視角
      if (currentMode !== 'bone') return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects([...pickableJoints, loadedModel], true);

      if (hits.length > 0) {
        let bone = null;
        let name = '';

        const sphereHit = hits.find((h) => h.object.userData && h.object.userData.bone);
        if (sphereHit) {
          bone = sphereHit.object.userData.bone;
          name = sphereHit.object.userData.chineseName;
        } else if (loadedModel) {
          const pt = hits[0].point;
          let minD = Infinity;
          const tempV = new THREE.Vector3();
          for (const jm of pickableJoints) {
            jm.getWorldPosition(tempV);
            const d = tempV.distanceTo(pt);
            if (d < minD) {
              minD = d;
              bone = jm.userData.bone;
              name = jm.userData.chineseName;
            }
          }
        }

        if (bone) {
          selectBone(bone, name);
          isDraggingBone = true;
          orbit.enabled = false;
          lastX = e.clientX;
          lastY = e.clientY;
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (currentMode === 'bone' && isDraggingBone && selectedBone) {
        const deltaX = e.clientX - lastX;
        const deltaY = e.clientY - lastY;

        const cameraRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        const cameraUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

        selectedBone.rotateOnWorldAxis(cameraUp, deltaX * 0.016);
        selectedBone.rotateOnWorldAxis(cameraRight, deltaY * 0.016);

        lastX = e.clientX;
        lastY = e.clientY;
      }
    });

    window.addEventListener('pointerup', () => {
      isDraggingBone = false;
      orbit.enabled = true;
    });

    document.getElementById('resetPoseBtn').addEventListener('click', () => {
      defaultRotations.forEach((rot, bone) => {
        bone.rotation.copy(rot);
      });
      selectBone(null);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      orbit.update();
      renderer.render(scene, camera);
    });
  </script></body></html>
