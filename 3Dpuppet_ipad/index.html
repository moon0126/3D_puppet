<!DOCTYPE html><html lang="zh-TW"><head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="3D木偶" />
  <link rel="manifest" href="./manifest.json" />

  <title>3D 人偶姿勢控制器</title>
  <style>
    * {
      touch-action: none;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
      box-sizing: border-box;
    }
    body {
      margin: 0;
      overflow: hidden;
      background: #181818;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    #hud {
      position: absolute;
      top: env(safe-area-inset-top, 20px);
      left: 20px;
      background: rgba(30, 30, 30, 0.92);
      color: #fff;
      padding: 16px 20px;
      border-radius: 12px;
      font-size: 14px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.5);
      border: 1px solid #383838;
      z-index: 10;
      line-height: 1.6;
      width: 290px;
    }
    .title {
      font-size: 15px;
      font-weight: bold;
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .mode-status {
      background: #2a2a2a;
      border: 1px solid #444;
      padding: 6px 12px;
      border-radius: 6px;
      font-weight: bold;
      margin-bottom: 10px;
      color: #e0e0e0;
    }
    .badge {
      color: #00ffcc;
      font-weight: bold;
    }
    .instructions {
      color: #aaa;
      font-size: 12px;
      margin-top: 10px;
      line-height: 1.6;
      border-top: 1px solid #3a3a3a;
      padding-top: 10px;
    }
    .btn-group {
      display: flex;
      gap: 10px;
      margin-top: 14px;
    }
    .btn {
      flex: 1;
      padding: 8px 10px;
      background: #3a3a3a;
      color: #fff;
      border: 1px solid #555;
      border-radius: 6px;
      cursor: pointer;
      font-size: 13px;
      font-weight: 500;
      text-align: center;
    }
    .btn-primary {
      background: #383838;
      border-color: #666;
    }
    .btn-primary.active {
      background: #00d4aa;
      color: #181818;
      border-color: #00d4aa;
      font-weight: bold;
    }
    .btn:active {
      background: #555;
    }
  </style>
  <script type="importmap">
    {
      "imports": {
        "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
        "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
      }
    }
  </script></head><body>
  <div id="hud">
    <div class="title">🎯 3D 人偶姿勢控制器</div>
    <div id="currentModeText" class="mode-status">當前模式：視角旋轉模式</div>
    <div>當前選中：<span id="currentPart" class="badge">無</span></div>
    
    <div class="instructions">
      🎮 操作方式：<br>
      • <span id="primaryGestureText">一般滑動：旋轉相機看角度</span><br>
      • 雙指捏合：縮放視角<br>
      • 三指滑動：平移視角 (移動畫面)
    </div>

    <div class="btn-group">
      <button id="toggleModeBtn" class="btn btn-primary">切換為關節模式</button>
      <button id="resetPoseBtn" class="btn">重置站姿</button>
    </div>
  </div>

  <script type="module">
    import * as THREE from 'three';
    import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
    import { TransformControls } from 'three/addons/controls/TransformControls.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

    // 1. 初始化 3D 環境
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x181818);

    const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 100);
    camera.position.set(0, 1.4, 3.0);

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    scene.add(new THREE.GridHelper(10, 20, 0x444444, 0x282828));
    scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

    const dirLight = new THREE.DirectionalLight(0xffffff, 1.8);
    dirLight.position.set(3, 8, 4);
    scene.add(dirLight);

    // 2. 視角控制器（配置單指、雙指、三指）
    const orbit = new OrbitControls(camera, renderer.domElement);
    orbit.target.set(0, 1.0, 0);
    orbit.enableDamping = true;
    orbit.dampingFactor = 0.05;
    orbit.enablePan = true;

    // 手勢對照設定
    function setupOrbitControls(isJointMode) {
      if (isJointMode) {
        // 關節模式：單指留給肢體，相機只由雙指旋轉縮放、三指平移
        orbit.touches = {
          ONE: null,
          TWO: THREE.TOUCH.DOLLY_ROTATE,
          THREE: THREE.TOUCH.PAN
        };
      } else {
        // 視角模式：單指直接旋轉相機，雙指縮放，三指平移
        orbit.touches = {
          ONE: THREE.TOUCH.ROTATE,
          TWO: THREE.TOUCH.DOLLY,
          THREE: THREE.TOUCH.PAN
        };
      }
      orbit.update();
    }
    setupOrbitControls(false); // 預設為視角模式

    const transform = new TransformControls(camera, renderer.domElement);
    transform.setMode('rotate');
    transform.size = 0.75;
    scene.add(transform);

    transform.addEventListener('dragging-changed', (e) => {
      orbit.enabled = !e.value;
    });

    // 3. 模式切換邏輯
    let isJointMode = false;
    const toggleBtn = document.getElementById('toggleModeBtn');
    const currentModeText = document.getElementById('currentModeText');
    const primaryGestureText = document.getElementById('primaryGestureText');
    const currentPartEl = document.getElementById('currentPart');

    function updateModeUI() {
      if (isJointMode) {
        currentModeText.textContent = '當前模式：關節調整模式';
        toggleBtn.textContent = '切換為視角模式';
        toggleBtn.classList.add('active');
        primaryGestureText.innerHTML = '<strong>單指拖曳：直接轉動人偶肢體</strong>';
      } else {
        currentModeText.textContent = '當前模式：視角旋轉模式';
        toggleBtn.textContent = '切換為關節模式';
        toggleBtn.classList.remove('active');
        primaryGestureText.innerHTML = '一般滑動：旋轉相機看角度';
        selectBone(null);
      }
      setupOrbitControls(isJointMode);
    }

    toggleBtn.addEventListener('click', () => {
      isJointMode = !isJointMode;
      updateModeUI();
    });

    // 4. 中文名稱映射
    function toChineseName(name) {
      const n = name.toLowerCase();
      if (n.includes('head')) return '頭部';
      if (n.includes('neck')) return '頸部';
      if (n.includes('spine2') || n.includes('chest')) return '胸部 / 上身';
      if (n.includes('spine1')) return '腹部';
      if (n.includes('spine')) return '腰部 / 脊椎';
      if (n.includes('hips') || n.includes('pelvis')) return '骨盆';

      const isLeft = n.includes('left') || n.endsWith('_l') || n.includes('.l');
      const isRight = n.includes('right') || n.endsWith('_r') || n.includes('.r');
      const prefix = isLeft ? '左' : isRight ? '右' : '';

      if (n.includes('shoulder')) return prefix + '肩膀';
      if (n.includes('forearm') || n.includes('elbow')) return prefix + '手肘（前臂）';
      if (n.includes('arm')) return prefix + '手臂（上臂）';
      if (n.includes('hand') || n.includes('wrist')) return prefix + '手掌';
      if (n.includes('upleg') || n.includes('thigh')) return prefix + '大腿';
      if (n.includes('leg') || n.includes('knee') || n.includes('calf')) return prefix + '膝蓋（小腿）';
      if (n.includes('foot') || n.includes('ankle') || n.includes('toe')) return prefix + '腳掌';

      return name;
    }

    // 5. 模型載入與關節判定
    const loader = new GLTFLoader();
    const MODEL_URL = 'https://threejs.org/examples/models/gltf/Xbot.glb';

    const pickableJoints = [];
    const defaultRotations = new Map();
    let loadedModel = null;
    let selectedBone = null;

    loader.load(MODEL_URL, (gltf) => {
      loadedModel = gltf.scene;
      scene.add(loadedModel);

      const sphereGeo = new THREE.SphereGeometry(0.07, 12, 12);

      loadedModel.traverse((child) => {
        if (child.isBone) {
          defaultRotations.set(child, child.rotation.clone());

          const chName = toChineseName(child.name);
          const isFinger = /thumb|index|middle|ring|pinky/i.test(child.name);

          if (!isFinger && chName !== child.name) {
            const jointMesh = new THREE.Mesh(
              sphereGeo,
              new THREE.MeshBasicMaterial({
                color: 0x00d4aa,
                transparent: true,
                opacity: 0.45,
                depthTest: false
              })
            );
            jointMesh.userData = {
              bone: child,
              chineseName: chName
            };
            child.add(jointMesh);
            pickableJoints.push(jointMesh);
          }
        }
      });
    });

    function selectBone(bone, name) {
      selectedBone = bone;
      if (bone) {
        transform.attach(bone);
        currentPartEl.textContent = name || toChineseName(bone.name);
      } else {
        transform.detach();
        currentPartEl.textContent = '無';
      }
    }

    // 6. 觸控交互邏輯
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();
    let isDraggingBone = false;
    let lastX = 0;
    let lastY = 0;

    window.addEventListener('pointerdown', (e) => {
      if (e.target.closest('#hud')) return;
      if (transform.dragging) return;

      // 只有在「關節調整模式」下才偵測肢體點擊
      if (!isJointMode) return;

      mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);
      const hits = raycaster.intersectObjects([...pickableJoints, loadedModel], true);

      if (hits.length > 0) {
        let bone = null;
        let name = '';

        const sphereHit = hits.find((h) => h.object.userData && h.object.userData.bone);
        if (sphereHit) {
          bone = sphereHit.object.userData.bone;
          name = sphereHit.object.userData.chineseName;
        } else if (loadedModel) {
          const pt = hits[0].point;
          let minD = Infinity;
          const tempV = new THREE.Vector3();
          for (const jm of pickableJoints) {
            jm.getWorldPosition(tempV);
            const d = tempV.distanceTo(pt);
            if (d < minD) {
              minD = d;
              bone = jm.userData.bone;
              name = jm.userData.chineseName;
            }
          }
        }

        if (bone) {
          selectBone(bone, name);
          isDraggingBone = true;
          orbit.enabled = false;
          lastX = e.clientX;
          lastY = e.clientY;
        }
      }
    });

    window.addEventListener('pointermove', (e) => {
      if (isJointMode && isDraggingBone && selectedBone) {
        const deltaX = e.clientX - lastX;
        const deltaY = e.clientY - lastY;

        const cameraRight = new THREE.Vector3(1, 0, 0).applyQuaternion(camera.quaternion);
        const cameraUp = new THREE.Vector3(0, 1, 0).applyQuaternion(camera.quaternion);

        selectedBone.rotateOnWorldAxis(cameraUp, deltaX * 0.016);
        selectedBone.rotateOnWorldAxis(cameraRight, deltaY * 0.016);

        lastX = e.clientX;
        lastY = e.clientY;
      }
    });

    window.addEventListener('pointerup', () => {
      isDraggingBone = false;
      orbit.enabled = true;
    });

    document.getElementById('resetPoseBtn').addEventListener('click', () => {
      defaultRotations.forEach((rot, bone) => {
        bone.rotation.copy(rot);
      });
      selectBone(null);
    });

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    renderer.setAnimationLoop(() => {
      orbit.update();
      renderer.render(scene, camera);
    });
  </script></body></html>
